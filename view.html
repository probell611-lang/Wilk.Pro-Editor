<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Статья</title>
    <style>
      :root { --bg: #ffffff; --text: #111111; --border: #e5e5e5; --action: #0088cc; --muted: #888888; }
      body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 40px 20px; max-width: 800px; margin: 0 auto; }
      h1 { font-size: 32px; margin-bottom: 24px; line-height: 1.2; }
      h2 { font-size: 26px; margin: 36px 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      p { margin-bottom: 16px; }
      blockquote { border-left: 4px solid var(--action); margin: 20px 0; padding-left: 16px; color: var(--muted); font-style: italic; }
      .note, .warning, .important { padding: 16px; border-radius: 6px; margin: 20px 0; }
      .note { background: #f0f7ff; border: 1px solid #cce5ff; color: #0056b3; }
      .warning { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
      .important { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
      img { max-width: 100%; height: auto; border-radius: 8px; margin: 12px 0; }
      iframe { width: 100%; border-radius: 8px; border: none; margin: 12px 0; }
      .divider { height: 2px; background: var(--border); margin: 30px 0; position: relative; }
      .divider::after { content: '—'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--bg); padding: 0 12px; color: var(--muted); }
      footer { margin-top: 60px; color: var(--muted); font-size: 13px; text-align: center; }
    </style>

    <!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9uJtZYWaYT7Z8hIrRd11eT_huiCw829w",
    authDomain: "wilk-pro-editor-7a469.firebaseapp.com",
    projectId: "wilk-pro-editor-7a469",
    storageBucket: "wilk-pro-editor-7a469.firebasestorage.app",
    messagingSenderId: "241990150929",
    appId: "1:241990150929:web:cdbdf514719e19c1bd7ab0"
    // measurementId не нужен
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


      window.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
          document.body.innerHTML = '<h1>ID статьи не указан</h1>';
          return;
        }

        const docRef = doc(db, 'articles', id);
        const snapshot = await getDoc(docRef);

        if (!snapshot.exists()) {
          document.body.innerHTML = '<h1>Статья не найдена</h1>';
          return;
        }

        const data = snapshot.data();
        document.querySelector('title').textContent = data.title;
        document.querySelector('h1').insertAdjacentHTML('afterend', data.content);
      });
    </script>
  </head>
  <body>
    <article>
      <h1></h1>
      <!-- Контент подставится JS -->
    </article>
    <footer>
      &copy; wilk Pro Article. Данные из Firebase.
    </footer>
  </body>
</html>

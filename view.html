<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статья</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #e5e5e5;
      --action: #0088cc;
      --muted: #888888;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --border: #333333;
      --muted: #aaaaaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header { margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    #article-title {
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
    }
    article { margin-top: 24px; }
    p { margin-bottom: 16px; }
    h2 {
      font-size: 28px;
      margin-top: 40px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    h3 {
      font-size: 22px;
      margin-top: 30px;
      margin-bottom: 10px;
    }
    ul, ol { margin-bottom: 16px; padding-left: 20px; }
    li { margin-bottom: 6px; }
    blockquote {
      border-left: 4px solid var(--action);
      margin: 20px 0;
      padding-left: 16px;
      color: var(--muted);
      font-style: italic;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 16px 0;
      display: block;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin: 16px 0;
      background: #000;
    }
    iframe {
      width: 100%;
      border-radius: 8px;
      border: none;
      margin: 16px 0;
    }
    .note, .warning, .important {
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
    }
    .note { background: #f0f7ff; border: 1px solid #cce5ff; color: #0056b3; }
    .warning { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
    .important { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .divider {
      height: 2px;
      background: var(--border);
      margin: 30px 0;
      position: relative;
    }
    .divider::after {
      content: '—';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      padding: 0 12px;
      color: var(--muted);
    }
    footer {
      margin-top: 60px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="article-title"></h1>
    </header>

    <article id="article-content">
      <!-- Контент подставится JS -->
    </article>

    <footer>
      &copy; wilk Pro Article. Данные сохранены в браузере (localStorage).
    </footer>
  </div>

  <script>
    const article = JSON.parse(localStorage.getItem('last_published_article'));

    if (!article) {
      document.body.innerHTML = `
        <div style="padding: 40px; text-align: center; font-family: sans-serif;">
          <h1>Статья не найдена</h1>
          <p>Сначала опубликуй статью в редакторе (<a href="index.html">index.html</a>).</p>
        </div>
      `;
      return;
    }

    document.getElementById('article-title').textContent = article.title;
    document.querySelector('title').textContent = article.title;
    document.getElementById('article-content').innerHTML = article.content;

    // Принудительно ставим id на H2 для якорей
    const h2s = document.querySelectorAll('#article-content h2');
    h2s.forEach((h, i) => {
      if (!h.id) h.id = 'section-' + i;
    });
  </script>
</body>
</html>

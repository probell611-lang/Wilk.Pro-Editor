<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wilk Editor (GitHub API)</title>
    <style>
      :root { --bg: #ffffff; --text: #111111; --border: #e5e5e5; --action: #0088cc; --muted: #888888; }
      [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --border: #333333; --muted: #aaaaaa; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.6; padding: 24px; transition: 0.3s; }
      .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 400px; gap: 24px; }
      @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
      
      header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
      h1 { font-size: 28px; font-weight: 400; }
      input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 18px; outline: none; }
      input[type="text"]:focus { border-color: var(--action); }
      #editor { min-height: 500px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; cursor: text; outline: none; white-space: pre-wrap; }
      [contenteditable]:empty::before { content: attr(placeholder); color: #ccc; pointer-events: none; display: block; }
      
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      button.tool { padding: 8px 12px; border: 1px solid var(--border); background: #f5f5f5; color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px; }
      button.btn-primary { background: var(--action); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px; }
      button.btn-primary:hover { background: #006699; }
      button.btn-primary:disabled { background: #aaa; cursor: not-allowed; }

      aside { border-left: 1px solid var(--border); padding-left: 20px; height: fit-content; }
      .panel { margin-bottom: 32px; }
      .panel h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
      
      #preview { background: rgba(0,0,0,0.05); border: 1px dashed var(--border); padding: 16px; min-height: 400px; overflow-y: auto; border-radius: 8px; }
      #preview img { max-width: 100%; border-radius: 4px; }
      
      #status { margin-top: 10px; font-size: 13px; padding: 8px; border-radius: 4px; display: none; }
      .success { background: #d4edda; color: #155724; }
      .error { background: #f8d7da; color: #721c24; }
      .loading { background: #fff3cd; color: #856404; }
    </style>
  </head>
  <body>
    <div class="container">
      <main>
        <header>
          <h1>Новая статья</h1>
          <input type="text" id="title" placeholder="Заголовок (обязательно)" />
        </header>

        <div class="toolbar">
          <button class="tool" onclick="exec('bold')">B</button>
          <button class="tool" onclick="exec('italic')">I</button>
          <button class="tool" onclick="insertLink()">🔗</button>
          <button class="tool" onclick="setHeading('H2')">H2</button>
          <button class="tool" onclick="promptMedia()">Медиа</button>
        </div>

        <div id="editor" contenteditable="true" placeholder="Начните писать..."></div>

        <!-- Кнопка публикации -->
        <button class="btn-primary" id="btn-publish" onclick="publishToGitHub()">Опубликовать на GitHub</button>
        
        <div id="status"></div>
      </main>

      <aside>
        <label style="font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
          <span>Тёмная тема</span>
          <input type="checkbox" id="theme-toggle" />
        </label>
        <div class="panel">
          <h3>Предпросмотр</h3>
          <div id="preview"></div>
        </div>
        <div class="panel">
          <h3>Статистика</h3>
          <p>Слов: <strong id="stat-words">0</strong></p>
          <p>Символов: <strong id="stat-chars">0</strong></p>
        </div>
      </aside>
    </div>

    <script>
      // ================= НАСТРОЙКИ =================
      // ⚠️ ВСТАВЬ СЮДА СВОЙ GITHUB TOKEN (права repo)
      const GITHUB_TOKEN = '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'; 
      
      // Имя твоего репозитория (владелец/название)
      const REPO_OWNER = 'probell611-lang';
      const REPO_NAME = 'wilk-articles';
      
      // Папка внутри репо, куда будут сохраняться статьи
      const ARTICLES_FOLDER = 'articles';
      // =============================================

      const titleEl = document.getElementById('title');
      const editorEl = document.getElementById('editor');
      const previewEl = document.getElementById('preview');
      const statusEl = document.getElementById('status');
      const btnPublish = document.getElementById('btn-publish');
      
      const statWordsEl = document.getElementById('stat-words');
      const statCharsEl = document.getElementById('stat-chars');

      document.getElementById('theme-toggle').addEventListener('change', (e) => {
        document.body.setAttribute('data-theme', e.target.checked ? 'dark' : '');
      });

      function updateStats() {
        const text = editorEl.innerText;
        statWordsEl.textContent = text.trim().split(/\s+/).filter(Boolean).length;
        statCharsEl.textContent = text.length;
      }

      function updatePreview() {
        previewEl.innerHTML = (titleEl.value ? `<h1>${escapeHtml(titleEl.value)}</h1>` : '') + editorEl.innerHTML;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function exec(cmd) { document.execCommand(cmd); editorEl.focus(); updateAll(); }
      
      function setHeading(tag) {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const content = range.cloneContents();
        const wrapper = document.createElement(tag);
        while(content.firstChild) wrapper.appendChild(content.firstChild);
        range.deleteContents();
        range.insertNode(wrapper);
        updateAll();
      }

      function insertLink() {
        const url = prompt('Введите URL:');
        if(url) { document.execCommand('createLink', false, url); updateAll(); }
      }

      function promptMedia() {
        const src = prompt('URL картинки или видео:');
        if(!src) return;
        if(/\.(jpg|jpeg|png|gif|webp)$/i.test(src)) {
          insertHtml(`<img src="${escapeHtml(src)}" alt="Медиа" loading="lazy">`);
        } else if (src.includes('youtube.com') || src.includes('youtu.be')) {
          const id = src.split('v=').pop().split('&')[0].replace('youtu.be/', '').split('/').pop();
          insertHtml(`<iframe width="100%" height="315" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`);
        } else {
          alert('Неподдерживаемый формат медиа');
        }
      }

      function insertHtml(html) {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const div = document.createElement('div');
        div.innerHTML = html;
        Array.from(div.childNodes).forEach(n => range.insertNode(n));
        range.collapse(false);
        editorEl.focus();
        updateAll();
      }

      function updateAll() {
        updateStats();
        updatePreview();
      }

      editorEl.addEventListener('input', updateAll);
      titleEl.addEventListener('input', () => {
        updateAll();
        updatePreview();
      });

      // --- ЛОГИКА ПУБЛИКАЦИИ ЧЕРЕЗ GITHUB API ---
      async function publishToGitHub() {
        const title = titleEl.value.trim();
        const content = editorEl.innerHTML.trim();

        if (!title || !content) {
          showStatus('Нужен заголовок и контент!', 'error');
          return;
        }

        btnPublish.disabled = true;
        showStatus('Загрузка на GitHub...', 'loading');

        // 1. Генерируем имя файла (slug)
        const slug = Math.random().toString(36).substring(2, 8).toUpperCase();
        const fileName = `${ARTICLES_FOLDER}/${slug}.html`;

        // 2. Формируем HTML страницы статьи
        const articleHtml = `
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <title>${escapeHtml(title)}</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.8; color: #333; }
              h1 { color: #000; border-bottom: 2px solid #eee; padding-bottom: 10px; }
              blockquote { border-left: 5px solid #0088cc; margin: 20px 0; padding-left: 15px; color: #555; font-style: italic; }
              .note { background: #f0f7ff; padding: 15px; border: 1px solid #cce5ff; }
              img { max-width: 100%; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>${escapeHtml(title)}</h1>
            ${content}
            <hr style="margin: 40px 0; border: none; border-top: 1px solid #ddd;">
            <p style="color: #888; font-size: 0.9em;">Статья опубликована через Wilk-Pro System</p>
            <a href="/">← Вернуться к редактору</a>
          </body>
          </html>
        `.trim();

        // 3. Получаем SHA текущего коммита (нужно для обновления файла)
        try {
          // Сначала получаем информацию о репозитории, чтобы узнать default branch и SHA
          const repoInfoRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
          });
          if (!repoInfoRes.ok) throw new Error('Ошибка доступа к репозиторию. Проверьте токен и владельца.');
          const repoInfo = await repoInfoRes.json();
          const branch = repoInfo.default_branch;
          
          const treeRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${branch}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
          });
          const treeData = await treeRes.json();
          const sha = treeData.sha; // Это SHA дерева, но нам нужен SHA коммита для создания нового коммита

          // На самом деле, для PUT запроса нам нужно сначала получить SHA последнего коммита ветки
          const commitsRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/commits?per_page=1`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
          });
          const commitsData = await commitsRes.json();
          const latestCommitSha = commitsData[0].sha;

          // 4. Создаем новый коммит
          const commitRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${GITHUB_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Add article: ${slug}`,
              content: btoa(unescape(encodeURIComponent(articleHtml))), // Кодируем в Base64
              branch: branch,
              sha: latestCommitSha // Если файла нет, этот параметр можно опустить, но для обновления нужен
            })
          });

          const commitData = await commitRes.json();

          if (commitRes.ok || commitData.commit) {
            const publicUrl = `https://${REPO_OWNER}.github.io/${REPO_NAME}/${fileName}`;
            showStatus(`✅ Статья загружена! Ссылка: <a href="${publicUrl}" target="_blank">${publicUrl}</a>`, 'success');
              alert('Статья успешно опубликована!\nСсылка: ' + publicUrl);
          } else {
            console.error(commitData);
            showStatus('❌ Ошибка публикации: ' + (commitData.message || 'Неизвестная ошибка'), 'error');
          }
        } catch (error) {
          console.error(error);
          showStatus('❌ Произошла ошибка: ' + error.message, 'error');
        } finally {
          btnPublish.disabled = false;
        }
      }

      function showStatus(message, type) {
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + type; // добавляем класс для цвета
        statusEl.style.display = 'block';
      }
    </script>
  </body>
</html>
